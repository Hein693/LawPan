services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lawpan-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/lawpan.db
      - BACKEND_CORS_ORIGINS=["http://localhost:5173","http://localhost","http://localhost:80","http://127.0.0.1:5173","http://127.0.0.1","*"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lawpan-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: lawpan-network
